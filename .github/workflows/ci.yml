name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: closet
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: closet
        run: ./gradlew build

# 컴파일 에러 ❌ → CI 실패
#
#테스트 실패 ❌ → CI 실패
#
#로컬에서만 되던 코드 ❌ → CI에서 걸러짐