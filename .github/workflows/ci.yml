name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: closet-test
          POSTGRES_USER: closet-user
          POSTGRES_PASSWORD: closet_1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U closet-user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create closettest database for JDBC
        run: |
          PGPASSWORD=closet_1234 psql -h localhost -U closet-user -d closet-test -c "CREATE DATABASE closettest;"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: closet
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: closet
        run: ./gradlew build -Dspring.profiles.active=ci

# 컴파일 에러 ❌ → CI 실패
#
#테스트 실패 ❌ → CI 실패
#
#로컬에서만 되던 코드 ❌ → CI에서 걸러짐