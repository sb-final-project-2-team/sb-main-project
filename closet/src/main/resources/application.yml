spring:
  application:
    name: closet

  datasource:
    url: jdbc:postgresql://localhost:5432/closet
    driver-class-name: org.postgresql.Driver
    username: closet-user
    password: closet_1234

  jpa:
    hibernate:
      ddl-auto: update   # (dev환경이면 update OK / prod는 validate 권장)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

closet:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:storage}
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@admin.com}
    password: ${ADMIN_PASSWORD:admin123}

security:
  jwt:
    issuer: closet
    secret: ${JWT_SECRET:376352270f35f8070b7a7e2ae299ca43}
    access-token-validity-seconds: 3600 # 1시간
    refresh-token-validity-seconds: 1204000 # 14일

logging:
  level:
    root: info
    org.hibernate.sql: info
    org.hibernate.type: trace