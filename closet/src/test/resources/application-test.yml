spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/closet-test
    username: closet-user
    password: closet_1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  sql:
    init:
      mode: never

closet:
  storage:
    type: local
    local:
      root-path: build/test-storage
