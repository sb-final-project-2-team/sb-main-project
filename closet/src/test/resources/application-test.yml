spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/testdb
    username: testuser
    password: testpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 시 자동으로 테이블 생성/삭제
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  sql:
    init:
      mode: never       # 기존 schema.sql 자동 실행 방지
