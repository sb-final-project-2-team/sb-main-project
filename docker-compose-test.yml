version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: closet-test-db
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5433:5432"  # 호스트의 5433 포트로 매핑 (기본 5432와 충돌 방지)
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-test-data:
