version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: closet-test-db
    environment:
      POSTGRES_DB: closet-test
      POSTGRES_USER: closet-user
      POSTGRES_PASSWORD: closet_1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closet-user -d closet-test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-test-data:
